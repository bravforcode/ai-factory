1. Open this file in Chrome
2. Press F12 → Console
3. Run: document.body.style.width='1200px'; document.body.style.height='630px';
4. Screenshot (Ctrl+Shift+S) or use Windows Snipping Tool
5. Save as og-image.png
-->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>Ai Factory OG Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .og-container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'IBM Plex Sans Thai', 'Inter', system-ui, sans-serif;
      position: relative;
      overflow: hidden;
    }

    /* Decorative elements */
    .og-container::before {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .og-container::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 50%;
    }

    .content {
      text-align: center;
      z-index: 1;
      padding: 40px;
    }

    .logo {
      font-size: 72px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .tagline {
      font-size: 32px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }

    .price-highlight {
      font-size: 48px;
      font-weight: 700;
      color: #fbbf24;
      text-shadow: 0 2px 10px rgba(251, 191, 36, 0.4);
      margin-bottom: 16px;
    }

    .product-count {
      font-size: 28px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 50px;
    }

    .url {
      position: absolute;
      bottom: 40px;
      font-size: 20px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="og-container">
    <div class="content">
      <div class="logo">⚡ Ai Factory</div>
      <div class="tagline">AI Tools for Freelancers & Students</div>
      <div class="price-highlight">เริ่มต้น ฿149</div>
      <div class="product-count">10 เครื่องมือพร้อมใช้</div>
    </div>
    <div class="url">ai-factory-omega.vercel.app</div>
  </div>
</body>
</html>
