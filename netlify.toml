# =============================================================================
# Netlify configuration — Ai Factory
# Static site, no build step, no backend, no functions.
# =============================================================================

[build]
  publish = "."
  # No build command — pure static HTML/CSS/JS.

[build.environment]
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Pretty URLs (Netlify native: /foo.html served as /foo, /index.html as /)
# The redirects below use the clean path form (no .html) where possible.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Convenience redirects — top-level aliases
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/products"
  to   = "/"
  status = 301

[[redirects]]
  from = "/demo"
  to   = "/demo/"
  status = 301

[[redirects]]
  from = "/demo/index.html"
  to   = "/demo/"
  status = 301

[[redirects]]
  from = "/thanks"
  to   = "/thanks-01-prompt-pack-th.html"
  status = 301

# -----------------------------------------------------------------------------
# Short-link redirects — /t/<slug> → <NN>-<slug>.html
# These let you share clean short URLs on social media / QR codes.
# Using 200 (rewrite) so the URL bar keeps the clean form, no .html visible.
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/t/prompt-pack-th"
  to   = "/01-prompt-pack-th.html"
  status = 200

[[redirects]]
  from = "/t/obsidian-student-kit"
  to   = "/02-obsidian-student-kit.html"
  status = 200

[[redirects]]
  from = "/t/freelance-pricing-calculator"
  to   = "/03-freelance-pricing-calculator.html"
  status = 200

[[redirects]]
  from = "/t/cold-email-template-pack"
  to   = "/04-cold-email-template-pack.html"
  status = 200

[[redirects]]
  from = "/t/ai-automation-workflow"
  to   = "/05-ai-automation-workflow.html"
  status = 200

[[redirects]]
  from = "/t/cv-international-template"
  to   = "/06-cv-international-template.html"
  status = 200

[[redirects]]
  from = "/t/n8n-sme-workflow-pack"
  to   = "/07-n8n-sme-workflow-pack.html"
  status = 200

[[redirects]]
  from = "/t/content-calendar-90d"
  to   = "/08-content-calendar-90d.html"
  status = 200

[[redirects]]
  from = "/t/finance-tracker-thb"
  to   = "/09-finance-tracker-thb.html"
  status = 200

[[redirects]]
  from = "/t/ai-agent-starter-github"
  to   = "/10-ai-agent-starter-github.html"
  status = 200

# -----------------------------------------------------------------------------
# Security headers — applied to every response
# CSP allows Tailwind CDN, Google Fonts, inline scripts (demo uses them).
# Tighten `script-src` if you ever remove inline JS.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection           = "1; mode=block"
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://cdn.tailwindcss.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://buy.stripe.com https://checkout.stripe.com"

# -----------------------------------------------------------------------------
# Cache static assets aggressively (1 year, immutable)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files: short cache so updates ship fast
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
